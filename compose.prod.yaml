# =============================================================================
# Logwell Production Docker Compose
# =============================================================================
# Full production stack with app and database.
#
# Required Environment Variables:
#   BETTER_AUTH_SECRET - Auth secret (min 32 chars). Generate: openssl rand -base64 32
#   ADMIN_PASSWORD     - Admin user password (min 8 chars)
#   DB_PASSWORD        - Database password (no default, for security)
#   ORIGIN             - Production URL (e.g., https://logs.example.com)
#
# Optional Environment Variables:
#   PORT               - App port (default: 3000)
#   LOGWELL_VERSION    - Image tag to run (default: the release this file shipped with).
#                        Upgrading? Back up first - see docs/operations.md.
#
# Usage:
#   export BETTER_AUTH_SECRET=$(openssl rand -base64 32)
#   export ADMIN_PASSWORD="your-secure-password"
#   export DB_PASSWORD=$(openssl rand -hex 24)   # hex: it is embedded in DATABASE_URL
#   export ORIGIN=https://logs.example.com
#   docker compose -f compose.prod.yaml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application Service
  # ---------------------------------------------------------------------------
  app:
    # Pinned so a restart never silently pulls a new release (and its migrations). CI fails
    # unless this default equals package.json's version, so release commits bump it.
    image: ghcr.io/divkix/logwell:${LOGWELL_VERSION:-v1.4.0}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      # Max request body (adapter default 512K) — bounds ingest batches, which can exceed 512K
      - BODY_SIZE_LIMIT=1M
      - DATABASE_URL=postgresql://logwell:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/logwell
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - ORIGIN=${ORIGIN:?ORIGIN is required}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The image ships no curl; probe with Node's built-in fetch (same as the Dockerfile HEALTHCHECK).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - logwell-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logwell
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: logwell
    volumes:
      # PostgreSQL 18+ resolves PGDATA under a version-specific subdirectory
      # (/var/lib/postgresql/18/docker), so the volume targets the parent path.
      #
      # Upgrading an existing volume that was created by postgres 17 or older? Its data sits in
      # <volume>/data, which this mount no longer reaches and PostgreSQL would silently initdb a
      # fresh cluster. Migrate the data (dump/restore, or pg_upgrade into the 18 layout) before
      # switching, or keep the old image and set PGDATA=/var/lib/postgresql/data here.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logwell -d logwell"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - logwell-network
    # Uncomment to expose database port externally (not recommended for production)
    # ports:
    #   - "5432:5432"

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  logwell-network:
    driver: bridge
