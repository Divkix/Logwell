# pnpm settings live here — pnpm 12 reads only auth/registry settings from .npmrc.
# A dependency's install scripts run only when listed below: pnpm's strictDepBuilds
# default fails the install on any build script nobody has reviewed.
packages:
  - sdks/typescript

allowBuilds:
  # Links esbuild's platform binary for vite and drizzle-kit.
  esbuild: true
  # Best-effort postinstall (errors are swallowed); already permitted by the SDK.
  msw: true

# Accepted peer mismatches, recorded so installs stay quiet:
peerDependencyRules:
  allowedVersions:
    # svelte-adapter-bun declares typescript ^5; the repo builds with TypeScript 6.
    typescript: "6"
  allowAny:
    # "vite" resolves to the vite-plus core fork, which carries its own 0.3.1
    # version that no consumer's vite peer range can match.
    - vite
    - vitest
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
  "@vitest/coverage-v8": 4.1.11
  "@vitest/ui": 4.1.11
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  cookie: ^0.7.2
  defu: ^6.1.7
  kysely: ^0.29.5
  lodash: ^4.18.1
  lodash-es: ^4.18.1
  postcss: ^8.5.26
  vite@*: "catalog:"
  vitest@*: "catalog:"
