# pnpm settings live here — pnpm 12 reads only auth/registry settings from .npmrc.
# A dependency's install scripts run only when listed below: pnpm's strictDepBuilds
# default fails the install on any build script nobody has reviewed.
packages:
  - sdks/typescript

allowBuilds:
  # Links esbuild's platform binary for vite and drizzle-kit.
  esbuild: true
  # Best-effort postinstall (errors are swallowed); already permitted by the SDK.
  msw: true

# Accepted peer mismatches, recorded so installs stay quiet:
peerDependencyRules:
  allowedVersions:
    # Optional Kit peer still declared as ^2; runed only touches $app/* in useSearchParams,
    # which we don't use. better-auth accepts ^3 from 1.7.8, so it needs no override.
    runed>@sveltejs/kit: "3"
    vite: "*"
    vitest: "*"
  allowAny:
    # Vite resolves to the Vite+ core alias; its package version differs from Vite peers.
    - vite
    - vitest
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 5.0.5
  "@vitest/ui": 5.0.5
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  defu: ^6.1.7
  kysely: ^0.29.5
  lodash: ^4.18.1
  lodash-es: ^4.18.1
  postcss: ^8.5.26
  # GHSA-68fv-2mgg-jv7q (high): event-loop DoS via indexed source-map offsets, fixed in 1.2.2.
  # Reaches the prod tree through postcss (vite-plus-core <- @sveltejs/kit).
  source-map-js: ^1.2.2
  vite@*: "catalog:"
  vitest@*: "catalog:"
# Deliberate upgrades newer than pnpm's supply-chain cool-off; pnpm added these when
# resolving the 2026-10 dependency bump. Remove once the releases age past the policy.
minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.12"
  - "@better-auth/drizzle-adapter@1.7.12"
  - "@better-auth/kysely-adapter@1.7.12"
  - "@better-auth/memory-adapter@1.7.12"
  - "@better-auth/mongo-adapter@1.7.12"
  - "@better-auth/prisma-adapter@1.7.12"
  - "@better-auth/telemetry@1.7.12"
  - "@lucide/svelte@1.60.0"
  - better-auth@1.7.12
