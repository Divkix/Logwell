# pnpm settings live here — pnpm 12 reads only auth/registry settings from .npmrc.
# A dependency's install scripts run only when listed below: pnpm's strictDepBuilds
# default fails the install on any build script nobody has reviewed.
packages:
  - sdks/typescript

allowBuilds:
  # Links esbuild's platform binary for vite and drizzle-kit.
  esbuild: true
  # Best-effort postinstall (errors are swallowed); already permitted by the SDK.
  msw: true

# Accepted peer mismatches, recorded so installs stay quiet:
peerDependencyRules:
  allowedVersions:
    # svelte-adapter-bun declares typescript ^5; the repo builds with TypeScript 6.
    typescript: "6"
    vite: "*"
    vitest: "*"
  allowAny:
    # Vite resolves to the Vite+ core alias; its package version differs from Vite peers.
    - vite
    - vitest
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vitest: 5.0.1
  vite-plus: 1.0.0-rc.0
  "@vitest/coverage-v8": 5.0.1
  "@vitest/ui": 5.0.1
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  cookie: ^0.7.2
  defu: ^6.1.7
  kysely: ^0.29.5
  lodash: ^4.18.1
  lodash-es: ^4.18.1
  postcss: ^8.5.26
  vite@*: "catalog:"
  vitest@*: "catalog:"
