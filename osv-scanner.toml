# osv-scanner configuration for Logwell (read by .github/workflows/osv-scanner.yml).
#
# No suppressions are active. The package-wide ignores that used to live here (effect, hono,
# @hono/node-server, undici, ws, esbuild, picomatch) all claimed "never in production", which was
# wrong: `effect` is a direct runtime dependency, `tsx` runs esbuild at container start, and the
# image's `pnpm install --prod` also links undici, ws and picomatch (verified by listing
# /app/node_modules/.pnpm in the built image). The Prisma/hono chain is no longer in the lockfile.
# None of them had an open advisory at the locked version when the ignores were removed.
#
# Policy:
#   1. Fix first: bump the dependency, or pin a patched version under `overrides` in
#      pnpm-workspace.yaml and regenerate pnpm-lock.yaml.
#   2. Only if no fix exists and the code is provably unreachable, suppress the single advisory,
#      never a whole package, and give it an expiry so it gets re-checked:
#
#        [[IgnoredVulns]]
#        id = "GHSA-xxxx-xxxx-xxxx"
#        ignoreUntil = 2026-12-31
#        reason = "<package> <version>: why the vulnerable code path cannot run in Logwell"
