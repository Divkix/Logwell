# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # pnpm workspace dependencies
  # npm ecosystem: the npm updater understands pnpm workspaces/lockfiles and keeps
  # pnpm-lock.yaml in sync, so CI's `pnpm install --frozen-lockfile` passes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - pnpm
    ignore:
      # vite-plus toolchain moves in lockstep via `vp migrate` only — solo bumps desync it and break CI (coverage startup abort).
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
      - dependency-name: "@voidzero-dev/vite-plus-core"
    groups:
      # Group all minor and patch updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Keep major updates separate for review
      svelte-ecosystem:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
          - "@testing-library/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  # Docker dependencies (Dockerfile and docker-compose)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
      include: scope
    labels:
      - dependencies
      - docker
    ignore:
      # The image must run the same Node major as CI (`runtime: node@24` in the workflows). Take
      # only Node 24 LTS minors/patches; bump image + workflows together by hand once the next
      # major reaches Active LTS (Node 26: 2026-10-28, nodejs/Release schedule.json).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Python SDK
  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(sdk-py)"
      include: scope
    labels:
      - dependencies
      - sdk
    groups:
      sdk-python:
        patterns:
          - "*"

  # Go SDK
  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(sdk-go)"
      include: scope
    labels:
      - dependencies
      - sdk
    groups:
      sdk-go:
        patterns:
          - "*"
