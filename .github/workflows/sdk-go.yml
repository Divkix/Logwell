name: SDK Go

on:
  push:
    branches: [main]
    paths:
      - "sdks/go/**"
      - ".github/workflows/sdk-go.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on same branch/PR
concurrency:
  group: sdk-go-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/go

env:
  GOTOOLCHAIN: local

jobs:
  changes:
    name: SDK Go Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Checkout PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect SDK changes
        id: detect
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- sdks/go/ .github/workflows/sdk-go.yml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then exit "$status"; fi
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  # =============================================================================
  # Lint
  # =============================================================================
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # Pinned to the repo toolchain (go.mod + test matrix): golangci-lint
          # v2.10.1 is built with Go 1.26 and panics loading Go 1.27 stdlib sources.
          go-version: "1.26.x"
          # The module lives in sdks/go, so caching needs the explicit path
          # (the default lookup only checks the repository root).
          cache-dependency-path: sdks/go/go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: sdks/go

  # =============================================================================
  # Test Matrix
  # =============================================================================
  test:
    name: Test (Go ${{ matrix.go-version }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdks/go/go.mod

      - name: Run tests
        run: go test -race -count=1 -v ./...

  # =============================================================================
  # Coverage
  # =============================================================================
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: sdks/go/go.mod

      - name: Run tests with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go
          path: sdks/go/coverage.out
          retention-days: 7

  # =============================================================================
  # Final Status Check (required for branch protection)
  # =============================================================================
  ci-success:
    name: SDK Go CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, test, coverage]
    if: always()
    env:
      CHANGE_RESULT: ${{ needs.changes.result }}
      SHOULD_RUN: ${{ needs.changes.outputs.run }}
      LINT: ${{ needs.lint.result }}
      TEST: ${{ needs.test.result }}
      COVERAGE: ${{ needs.coverage.result }}

    steps:
      - name: Check all jobs status
        run: |
          [[ "$CHANGE_RESULT" == 'success' ]] || exit 1
          if [[ "$SHOULD_RUN" == 'true' ]]; then expected=success
          elif [[ "$SHOULD_RUN" == 'false' ]]; then expected=skipped
          else exit 1
          fi
          for result in "$LINT" "$TEST" "$COVERAGE"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
        working-directory: .
