name: SDK TypeScript

on:
  push:
    branches: [main]
    paths:
      - "sdks/typescript/**"
      - ".github/workflows/sdk-typescript.yml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on same branch/PR
concurrency:
  group: sdk-ts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/typescript

jobs:
  changes:
    name: SDK TypeScript Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - name: Checkout PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect SDK changes
        id: detect
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- sdks/typescript/ .github/workflows/sdk-typescript.yml pnpm-workspace.yaml tsconfig.json package.json pnpm-lock.yaml; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then exit "$status"; fi
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  # =============================================================================
  # Lint & Type Check
  # =============================================================================
  lint:
    name: Lint & Type Check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter and type check
        run: pnpm run check

  # =============================================================================
  # Unit Tests
  # =============================================================================
  test-unit:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

  # =============================================================================
  # Integration Tests
  # =============================================================================
  test-integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm run test:integration

  # =============================================================================
  # Build & Verify
  # =============================================================================
  build:
    name: Build & Verify
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Verify types with attw
        run: pnpm run attw

      - name: Check bundle size
        run: pnpm run size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sdk-typescript-dist
          path: sdks/typescript/dist/
          retention-days: 7

  # =============================================================================
  # Publish to npm (only on main, only if version changed)
  # =============================================================================
  publish:
    name: Publish to npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-unit, test-integration, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Check if version exists on npm
        id: version-check
        run: |
          PACKAGE_NAME=$(jq -r '.name' package.json)
          LOCAL_VERSION=$(jq -r '.version' package.json)
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "local_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

          # Check if this version already exists on npm
          if npm view "${PACKAGE_NAME}@${LOCAL_VERSION}" version 2>/dev/null; then
            echo "Version $LOCAL_VERSION already exists on npm"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $LOCAL_VERSION is new, will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm (OIDC)
        if: steps.version-check.outputs.should_publish == 'true'
        run: NODE_AUTH_TOKEN="" npm publish

      - name: Add publish info to job summary
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          echo "## 📦 SDK Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`${{ steps.version-check.outputs.package_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version-check.outputs.local_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install ${{ steps.version-check.outputs.package_name }}@${{ steps.version-check.outputs.local_version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Skip publish info
        if: steps.version-check.outputs.should_publish == 'false'
        run: |
          echo "## ℹ️ SDK Publish Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version \`${{ steps.version-check.outputs.local_version }}\` already exists on npm." >> $GITHUB_STEP_SUMMARY
          echo "Bump the version in \`sdks/typescript/package.json\` to trigger a new publish." >> $GITHUB_STEP_SUMMARY

      # -------------------------------------------------------------------------
      # JSR Publishing
      # -------------------------------------------------------------------------
      - name: Check if version exists on JSR
        id: jsr-version-check
        run: |
          JSR_NAME=$(jq -r '.name' jsr.json)
          LOCAL_VERSION=$(jq -r '.version' jsr.json)
          echo "jsr_name=$JSR_NAME" >> $GITHUB_OUTPUT
          echo "jsr_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

          # Check if version exists on JSR (returns 404 if not found)
          if curl -sf "https://jsr.io/${JSR_NAME}/${LOCAL_VERSION}_meta.json" > /dev/null 2>&1; then
            echo "Version $LOCAL_VERSION already exists on JSR"
            echo "should_publish_jsr=false" >> $GITHUB_OUTPUT
          else
            echo "Version $LOCAL_VERSION is new, will publish to JSR"
            echo "should_publish_jsr=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to JSR (OIDC)
        if: steps.jsr-version-check.outputs.should_publish_jsr == 'true'
        run: npx jsr publish

      - name: Add JSR publish info to job summary
        if: steps.jsr-version-check.outputs.should_publish_jsr == 'true'
        run: |
          echo "## 📦 SDK Published to JSR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`${{ steps.jsr-version-check.outputs.jsr_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.jsr-version-check.outputs.jsr_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npx jsr add ${{ steps.jsr-version-check.outputs.jsr_name }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Skip JSR publish info
        if: steps.jsr-version-check.outputs.should_publish_jsr == 'false'
        run: |
          echo "## ℹ️ JSR Publish Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version \`${{ steps.jsr-version-check.outputs.jsr_version }}\` already exists on JSR." >> $GITHUB_STEP_SUMMARY

  sdk-ci-success:
    name: SDK TypeScript CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, test-unit, test-integration, build]
    if: always()
    env:
      CHANGE_RESULT: ${{ needs.changes.result }}
      SHOULD_RUN: ${{ needs.changes.outputs.run }}
      LINT: ${{ needs.lint.result }}
      UNIT: ${{ needs.test-unit.result }}
      INTEGRATION: ${{ needs.test-integration.result }}
      BUILD: ${{ needs.build.result }}
    steps:
      - name: Require all applicable SDK checks
        working-directory: .
        run: |
          [[ "$CHANGE_RESULT" == 'success' ]] || exit 1
          if [[ "$SHOULD_RUN" == 'true' ]]; then expected=success
          elif [[ "$SHOULD_RUN" == 'false' ]]; then expected=skipped
          else exit 1
          fi
          for result in "$LINT" "$UNIT" "$INTEGRATION" "$BUILD"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
