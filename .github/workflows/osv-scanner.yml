name: OSV Scan

# Fails on any known vulnerability in pnpm-lock.yaml that osv-scanner.toml does not suppress.
# The weekly run catches advisories published against dependencies that haven't changed.
on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan pnpm-lock.yaml
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
