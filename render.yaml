# Render Blueprint. Costs money as written: neither the web service nor the database sets a plan,
# so Render uses its default paid instance types (render.com/docs/blueprint-spec). Keep the web
# service at ONE instance: rate limits, live streams and the retention job are in-process.
services:
  - type: web
    name: logwell
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logwell-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Public URL, e.g. https://logwell.onrender.com (or your custom domain) - CSRF + auth origin.
      - key: ORIGIN
        sync: false
      # Seeds the admin user on boot (min 8 chars). Sign-up is disabled, so without it nobody can
      # log in. Prompted once when the Blueprint is created.
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: logwell-db
    databaseName: logwell
    # No `plan: free` on purpose: free Render Postgres expires 30 days after creation and is
    # deleted with all its data 14 days later (render.com/docs/free). The default paid instance
    # keeps logs. To trial for free anyway, set `plan: free` and migrate off before day 30.
