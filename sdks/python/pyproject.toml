[build-system]
requires = ["hatchling<1.33.0"]
build-backend = "hatchling.build"

[project]
name = "logwell"
version = "1.1.4"
description = "Official Python SDK for Logwell logging platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Divkix", email = "divkix@divkix.me" }]
keywords = ["logging", "logs", "observability", "logwell", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1", "typing_extensions>=4.16.0"]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "respx>=0.23.1",
  "mypy>=2.3.1",
  "ruff>=0.16.3",
  "pytest-cov>=7.1.0",
  "coverage[toml]>=7.15.4",
]

[project.urls]
Homepage = "https://github.com/Divkix/Logwell"
Documentation = "https://github.com/Divkix/Logwell/tree/main/sdks/python#readme"
Repository = "https://github.com/Divkix/Logwell"
Issues = "https://github.com/Divkix/Logwell/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/logwell"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
