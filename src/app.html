<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- SEO -->
    <meta
      name="description"
      content="Self-hosted logging platform with real-time streaming, full-text search, and per-project API keys."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Logwell" />
    <meta
      property="og:description"
      content="Self-hosted logging platform with real-time streaming, full-text search, and per-project API keys."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Logwell" />
    <meta
      name="twitter:description"
      content="Self-hosted logging platform with real-time streaming, full-text search, and per-project API keys."
    />

    <!--
      Applies the saved light/dark mode before first paint (no flash of the wrong theme).
      Mirrors mode-watcher's setInitialMode with ModeWatcher's default options; it lives here
      rather than in ModeWatcher's injected copy because only app.html can carry the CSP nonce.
      src/lib/theme-init.component.test.ts keeps the two in step.
    -->
    <script nonce="%sveltekit.nonce%" id="theme-init">
      (function () {
        var root = document.documentElement;
        var mode = localStorage.getItem("mode-watcher-mode") ?? "system";
        var theme = localStorage.getItem("mode-watcher-theme") ?? "";
        var light =
          mode === "light" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        root.classList.toggle("dark", !light);
        root.style.colorScheme = light ? "light" : "dark";
        if (theme) {
          root.setAttribute("data-theme", theme);
          localStorage.setItem("mode-watcher-theme", theme);
        }
        localStorage.setItem("mode-watcher-mode", mode);
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
